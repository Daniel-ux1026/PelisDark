services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Configure SQL_SA_PASSWORD in .env}
    ports:
      - 127.0.0.1:1433:1433
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: [CMD-SHELL, 'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q "SELECT 1" -b -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - 127.0.0.1:1025:1025
      - 127.0.0.1:8025:8025
    restart: unless-stopped
volumes:
  sql-data:
